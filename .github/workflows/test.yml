name: tests

# Policy as code runs here too, but as part of the full suite: every test kind the
# plugin promises (unit, regression, integration, e2e, shell) plus mutation testing.
on:
  push:
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the policy check diffs against the base branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The mount-boundary suites run in an unprivileged user namespace. Ubuntu
      # 24.04 restricts those by default (AppArmor), which would skip the suites
      # that carry most of the mutation coverage. Re-enable them so CI runs what
      # a developer runs.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: All test kinds (policy, shell, mutation)
        run: bash tools/run_tests.sh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
